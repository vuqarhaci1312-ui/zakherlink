<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Management</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #0f1419;
      color: #f5f5f5;
      padding: 1.5rem;
    }

    .content {
      text-align: center;
      max-width: 900px;
    }

    .message {
      font-size: clamp(1.75rem, 5vw, 3rem);
      font-weight: 600;
      line-height: 1.3;
      margin-bottom: 2.5rem;
      letter-spacing: 0.02em;
    }

    .phones {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .phones a {
      font-size: clamp(1.5rem, 4.5vw, 2.75rem);
      font-weight: 700;
      color: #7dd3fc;
      text-decoration: none;
      letter-spacing: 0.04em;
    }

    .phones a:hover {
      color: #bae6fd;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="content">
    <p class="message">Please contact with management</p>
    <div class="phones">
      <a href="tel:+971565902100">+971 56 590 21 00</a>
      <a href="tel:+994502532209">+994 50 253 22 09</a>
    </div>
  </div>
</body>
</html>
